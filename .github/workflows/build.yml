name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release creation on tag pushes; read-only on PRs anyway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci

      - run: npm run lint

      # pretest builds dist/netdiagram.html, then the assertion suite runs
      - run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: netdiagram-html
          path: dist/netdiagram.html
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # attach two copies: a versioned asset (non-colliding downloads) and the
          # stable netdiagram.html name (for a releases/latest/download/... link)
          cp dist/netdiagram.html "netdiagram-$GITHUB_REF_NAME.html"
          gh release create "$GITHUB_REF_NAME" \
            dist/netdiagram.html "netdiagram-$GITHUB_REF_NAME.html" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # Hosted copy (package.json "homepage") — share links made from a local copy
  # open it. One-time setup: Settings -> Pages -> Source: GitHub Actions.
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: netdiagram-html
          path: site

      - run: mv site/netdiagram.html site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
