<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netdiagram — YAML network schematics</title>
<script><!--INJECT:JSYAML--></script>
<script><!--INJECT:ELK--></script>
<script><!--INJECT:EDITOR--></script>
<style>
  :root{
    --ink:#24344d;          /* blueprint ink */
    --paper:#fafbf7;        /* schematic paper */
    --grid:#e3e8de;
    --slate:#1e2530;        /* editor bg */
    --slate-2:#161c25;
    --editor-text:#d7dee8;
    --accent:#b45309;
    --glow:#f59e0b;         /* selected diagram item */
    --err:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    background:var(--slate-2);color:var(--editor-text);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;row-gap:9px;
    padding:10px 16px;background:var(--slate-2);
    border-bottom:1px solid #2c3542;flex-shrink:0;
  }
  header h1{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8fa3bf;margin-right:12px}
  header h1 b{color:#e8eef6;font-weight:700}
  button{
    font:inherit;font-size:12px;padding:6px 14px;cursor:pointer;
    background:transparent;color:#aebbcc;border:1px solid #3a4556;border-radius:4px;
    letter-spacing:.04em;
  }
  button:hover{border-color:#5b6b82;color:#e8eef6}
  button:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  button.primary{background:#e8eef6;color:var(--slate-2);border-color:#e8eef6;font-weight:600}
  button.primary:hover{background:#fff}
  select{
    font:inherit;font-size:12px;padding:6px 10px;cursor:pointer;
    background:var(--slate);color:#aebbcc;border:1px solid #3a4556;border-radius:4px;
  }
  select:hover{border-color:#5b6b82;color:#e8eef6}
  select:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  .picker{display:flex;align-items:center;gap:7px}
  .picker-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7d8da3;white-space:nowrap;cursor:pointer}
  #sel-example,#sel-project{max-width:190px}
  #btn-save.dirty{border-color:var(--accent);color:#f0c088}
  /* diagram outputs: kept together and pushed to the right, even when wrapped */
  .hdr-actions{display:flex;align-items:center;gap:14px;margin-left:auto}
  main{flex:1;display:flex;min-height:0}
  #editor-pane{
    width:var(--editor-w,38%);min-width:220px;display:flex;flex-direction:column;
    border-right:1px solid #2c3542;background:var(--slate);
  }
  #splitter{
    flex:0 0 6px;cursor:col-resize;background:var(--slate-2);
    transition:background .15s;touch-action:none;
  }
  #splitter:hover,#splitter.dragging{background:var(--accent)}
  #editor{
    flex:1;overflow:hidden;min-height:0;
  }
  #editor .cm-editor{height:100%}
  #editor-foot{
    flex-shrink:0;display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-top:1px solid #2c3542;background:var(--slate-2);
  }
  #status{
    flex-shrink:0;padding:7px 14px;font-size:11.5px;line-height:1.5;
    border-top:1px solid #2c3542;color:#7d8da3;min-height:32px;
  }
  #status.error{color:#ff9d8f;background:#2a1a18}
  #right-pane{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
  #view-tabs{display:flex;flex-shrink:0;background:var(--slate-2);border-bottom:1px solid #2c3542}
  .tab-btn{border:0;border-radius:0;border-bottom:2px solid transparent;padding:8px 20px;font-size:12px;
    background:transparent;color:#6b7a8f;letter-spacing:.04em;cursor:pointer}
  .tab-btn:hover{color:#aebbcc;border-color:transparent}
  .tab-btn.active{color:#e8eef6;border-bottom-color:var(--accent)}
  #canvas-pane{flex:1;overflow:auto;background:var(--paper);position:relative}
  #canvas-pane.panning{cursor:grabbing}
  #canvas-pane.panning *{cursor:grabbing}
  #canvas-pane svg{display:block;margin:0 auto}
  #zoom-tools{
    position:absolute;right:18px;bottom:16px;display:flex;gap:5px;z-index:2;
  }
  #zoom-tools button{
    padding:4px 9px;font-size:11.5px;background:#fff;color:#4b5866;
    border:1px solid #c4ccc5;border-radius:4px;box-shadow:0 1px 3px rgba(36,52,77,.12);
  }
  #zoom-tools button:hover{border-color:#7a8798;color:#1a2638}
  #zoom-pct{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
  #canvas-pane .edge{cursor:pointer}
  #canvas-pane .edge-lbl{cursor:pointer}
  #canvas-pane .edge,#canvas-pane .edge-lbl{transition:opacity .15s}
  #canvas-pane .edge-lo{opacity:.12}
  #canvas-pane .nd-node,#canvas-pane .nd-group>rect:first-child{cursor:pointer}
  /* selection (editor cursor / diagram click): amber outline + glow, pulsing
   * briefly when it changes. Screen only — downloads use the clean SVG. */
  #canvas-pane .nd-sel{filter:drop-shadow(0 0 5px var(--glow))}
  #canvas-pane .nd-node.nd-sel>rect:first-child,
  #canvas-pane .nd-group.nd-sel>rect:first-child{stroke:var(--glow);stroke-width:3}
  #canvas-pane .edge.nd-sel{stroke-width:4}
  #canvas-pane .edge-lbl.nd-sel{filter:drop-shadow(0 0 2px var(--glow));animation:none}   /* keep label text crisp */
  #canvas-pane .nd-pulse{animation:nd-pulse .6s ease-in-out 3}
  @keyframes nd-pulse{50%{filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 14px var(--glow))}}
  @media (prefers-reduced-motion:reduce){#canvas-pane .nd-pulse{animation:none}}
  #view-picker{padding:0 12px;border-left:1px solid #2c3542;margin-left:8px;flex-shrink:0}
  #view-picker[hidden]{display:none}
  #tag-filter{display:flex;align-items:center;gap:6px;margin-left:auto;padding:0 12px;flex-wrap:wrap;min-width:0}
  #tag-filter[hidden]{display:none}
  #tag-chips{display:flex;gap:5px;flex-wrap:wrap}
  .tag-chip{padding:2px 9px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px}
  .tag-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  /* ---- optional LLM assistant (absent entirely in a --no-assist build) ---- */
  #assist-review{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 12px;
    border-top:1px solid #2c3542;background:#2a2118;color:#f0c088;font-size:11.5px}
  #assist-review[hidden]{display:none}
  #assist-review-msg{flex:1;min-width:0}
  #assist-back{position:fixed;inset:0;background:rgba(10,14,20,.68);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px}
  #assist-back[hidden]{display:none}
  #assist-panel{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--slate);
    border:1px solid #3a4556;border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  #assist-panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8fa3bf;font-weight:600}
  #assist-panel label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7d8da3;
    display:block;margin-bottom:4px}
  #assist-panel input[type=text],#assist-panel input[type=password],#assist-panel textarea,#assist-panel select{
    font:inherit;font-size:12px;width:100%;padding:7px 10px;background:var(--slate-2);color:#d7dee8;
    border:1px solid #3a4556;border-radius:4px}
  #assist-panel textarea{resize:vertical;min-height:74px;line-height:1.5}
  #assist-panel .row{display:flex;gap:10px}
  #assist-panel .row>*{flex:1;min-width:0}
  .assist-check{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#9aa7ba;text-transform:none;letter-spacing:0}
  .assist-check input{width:auto}
  #assist-note{font-size:11px;line-height:1.5;color:#8fa3bf}
  #assist-note.warn{color:#f0c088}
  #assist-preview{font-size:11px;color:#7d8da3}
  #assist-preview pre{margin-top:6px;max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    background:var(--slate-2);border:1px solid #2c3542;border-radius:4px;padding:9px;color:#9aa7ba;line-height:1.45}
  #assist-status{font-size:11.5px;color:#7d8da3;min-height:17px}
  #assist-status.error{color:#ff9d8f}
  #assist-actions{display:flex;gap:9px;justify-content:flex-end}
  body.dropping #right-pane::after{content:"Drop to import";position:absolute;inset:12px;display:flex;
    align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:8px;
    background:rgba(22,28,37,.72);color:#f0c088;font-size:14px;letter-spacing:.08em;z-index:5;pointer-events:none}
  .conn-chg{font-weight:700;text-align:center;width:24px}
  .conn-table tr.chg-added td{background:rgba(21,128,61,.08)}
  .conn-table tr.chg-removed td{background:rgba(192,57,43,.08);text-decoration:line-through;text-decoration-color:rgba(192,57,43,.5)}
  .conn-table tr.chg-changed td{background:rgba(180,83,9,.08)}
  .chg-added .conn-chg{color:#15803d}.chg-removed .conn-chg{color:#c0392b}.chg-changed .conn-chg{color:#b45309}
  #connections-pane{flex:1;overflow:auto;background:var(--paper);color:var(--ink);font-size:12px}
  .conn-toolbar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 10px;border-bottom:1px solid #dde3d7;position:sticky;top:0;
    background:var(--paper);z-index:1}
  .conn-toolbar h2{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#7a8798;display:flex;align-items:baseline;gap:10px}
  .conn-excl{font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:#b0bbc8}
  .conn-table{border-collapse:collapse;width:100%}
  .conn-table th,.conn-table td{padding:8px 14px;text-align:left;border-bottom:1px solid #dde3d7;white-space:nowrap}
  .conn-table th{background:#f0f2ec;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:#7a8798;font-weight:700;border-bottom:2px solid #c4ccc5;position:sticky;top:49px;z-index:1}
  .conn-table tbody tr:hover{background:#f3f5ef}
  .conn-n{color:#b0bbc8;font-size:10.5px;text-align:right;width:28px;user-select:none}
  .conn-ep .conn-name{display:block;color:#24344d}
  .conn-ep .conn-addr{display:block;color:#7a8798;font-size:10.5px;margin-top:1px}
  .conn-proto{font-size:11px;color:#4b5866;font-weight:600}
  .conn-port{color:#3f5e8c;font-weight:600}
  .conn-label{color:#9aa6b4;font-size:11px}
  .conn-comment{color:#6b7a8f;font-size:11px;white-space:normal;max-width:340px}
  .conn-dash{color:#c4ccc5}
  .conn-empty{padding:32px 20px;color:#7a8798;font-style:italic}
  @media (max-width:760px){
    main{flex-direction:column}
    #editor-pane{width:100%;height:var(--editor-h,45%);min-height:120px;border-right:0;border-bottom:1px solid #2c3542}
    #splitter{cursor:row-resize}
  }
</style>
</head>
<body>
<header>
  <h1><b>netdiagram</b></h1>
  <div class="picker" id="project-picker">
    <label class="picker-label" for="sel-project">Project</label>
    <select id="sel-project" title="Open or switch between projects saved in this browser"></select>
  </div>
  <button id="btn-save" title="Save the current YAML as a named project in this browser (Ctrl/Cmd+S)">Save</button>
  <button id="btn-import" title="Load a file into the editor: netdiagram YAML, an SVG exported by netdiagram, an Ansible inventory, Terraform state or a NetBox export (or drop it onto the page)">Import</button>
  <input id="file-yaml" type="file" accept=".yaml,.yml,.svg,.ini,.json,.tfstate,.txt,text/yaml,text/plain,image/svg+xml,application/json" hidden>
  <button id="btn-assist" title="Draft or revise the YAML with an LLM endpoint you choose — local or hosted. Nothing is sent until you configure a provider and press Send." hidden>Assist</button>
  <button id="btn-yaml" title="Download the current YAML to a file">Download YAML</button>
  <button id="btn-del" title="Delete the current project" hidden>Delete</button>
  <div class="picker" id="compare-picker">
    <label class="picker-label" for="sel-compare">Compare</label>
    <select id="sel-compare" title="Show what changed against a saved project or a file: added, removed and changed items are marked in the diagram and the Connections table"></select>
  </div>
  <input id="file-compare" type="file" accept=".yaml,.yml,.svg,text/yaml,text/plain,image/svg+xml" hidden>
  <div class="hdr-actions">
    <button id="btn-share" title="Copy a link that carries this diagram in the URL fragment (never sent to a server)">Share link</button>
    <button id="btn-pdf" title="Open the print dialog to save as PDF">Export PDF</button>
    <button id="btn-download" class="primary">Download SVG</button>
  </div>
</header>
<main>
  <div id="editor-pane">
    <div id="editor" aria-label="YAML source"></div>
    <div id="editor-foot">
      <label class="picker-label" for="sel-example">Load example</label>
      <select id="sel-example"
              aria-label="Load an example into the editor"
              title="Loads the selected example into the editor (replaces the current contents)"></select>
    </div>
    <div id="assist-review" hidden>
      <span id="assist-review-msg"></span>
      <button id="assist-accept" class="primary">Accept</button>
      <button id="assist-discard">Discard</button>
    </div>
    <div id="status">Ready.</div>
  </div>
  <div id="splitter" role="separator" aria-label="Resize editor" title="Drag to resize · double-click to reset"></div>
  <div id="right-pane">
    <div id="view-tabs">
      <button class="tab-btn active" data-pane="canvas-pane">Diagram</button>
      <button class="tab-btn" data-pane="connections-pane">Connections</button>
      <div class="picker" id="view-picker" hidden>
        <label class="picker-label" for="sel-view">View</label>
        <select id="sel-view" title="Draw one of the named views this document defines (views: in the YAML) instead of the whole diagram"></select>
      </div>
      <div id="tag-filter" hidden>
        <span class="picker-label">Show tags</span>
        <span id="tag-chips"></span>
      </div>
    </div>
    <div id="canvas-pane" aria-label="Rendered diagram"></div>
    <div id="connections-pane" hidden></div>
    <div id="zoom-tools">
      <button id="zoom-out" title="Zoom out">&minus;</button>
      <button id="zoom-pct" title="Reset to 100%">100%</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit diagram to view">Fit</button>
    </div>
  </div>
</main>

<div id="assist-back" hidden>
  <div id="assist-panel" role="dialog" aria-modal="true" aria-labelledby="assist-title">
    <h2 id="assist-title">Assist — draft with an LLM</h2>
    <div class="row">
      <div>
        <label for="assist-provider">Provider</label>
        <select id="assist-provider"></select>
      </div>
      <div>
        <label for="assist-model">Model</label>
        <input id="assist-model" type="text" spellcheck="false" autocomplete="off">
      </div>
    </div>
    <div>
      <label for="assist-base">Endpoint</label>
      <input id="assist-base" type="text" spellcheck="false" autocomplete="off">
    </div>
    <div id="assist-key-row">
      <label for="assist-key">API key</label>
      <input id="assist-key" type="password" spellcheck="false" autocomplete="off">
      <label class="assist-check" style="margin-top:6px">
        <input id="assist-remember" type="checkbox">
        Remember the key in this browser (stored in local storage)
      </label>
    </div>
    <p id="assist-note"></p>
    <div>
      <label for="assist-prompt">What should it do?</label>
      <textarea id="assist-prompt" placeholder="e.g. add a second firewall in HA with the edge router, or: draft a three-tier web app behind a WAF"></textarea>
      <label class="assist-check" style="margin-top:7px">
        <input id="assist-context" type="checkbox" checked>
        Send the current document as context (uncheck to draft from scratch)
      </label>
    </div>
    <details id="assist-preview">
      <summary>Show exactly what will be sent</summary>
      <pre id="assist-payload"></pre>
    </details>
    <div id="assist-status"></div>
    <div id="assist-actions">
      <button id="assist-close">Cancel</button>
      <button id="assist-send" class="primary">Send</button>
    </div>
  </div>
</div>

<script><!--INJECT:APP--></script>
</body>
</html>
